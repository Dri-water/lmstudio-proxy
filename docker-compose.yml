services:
  lmstudio-proxy:
    build: .
    container_name: lmstudio-proxy
    ports:
      - "${PROXY_PORT:-1235}:${PROXY_PORT:-1235}"
      - "${ADMIN_PORT:-8090}:${ADMIN_PORT:-8090}"
    environment:
      PROXY_PORT: ${PROXY_PORT:-1235}
      ADMIN_PORT: ${ADMIN_PORT:-8090}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234}
      DEBUG: ${DEBUG:-false}
    volumes:
      - proxy-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  proxy-data:
