services:
  lmstudio-proxy:
    build: .
    container_name: lmstudio-proxy
    ports:
      # host:container — change the left side to expose on a different host port
      - "${PROXY_PORT:-1235}:1235"
      - "${ADMIN_PORT:-8090}:8090"
    environment:
      # Fixed listen ports inside the container (must match the right side above)
      PROXY_PORT: "1235"
      ADMIN_PORT: "8090"
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234}
      DEBUG: ${DEBUG:-false}
    volumes:
      - proxy-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  proxy-data:
